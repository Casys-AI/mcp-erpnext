name: Publish

on:
  workflow_call:
    inputs:
      npm_dist_tag:
        description: npm distribution tag (auto selects next for prereleases)
        required: false
        type: string
        default: auto
  workflow_dispatch:
    inputs:
      npm_dist_tag:
        description: npm distribution tag
        required: true
        type: choice
        default: auto
        options:
          - auto
          - next
          - latest

jobs:
  release_guard:
    runs-on: ubuntu-latest
    outputs:
      npm_dist_tag: ${{ steps.release.outputs.npm_dist_tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - id: release
        name: Validate release ref, versions, and npm channel
        env:
          REQUESTED_NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
        run: |
          VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('deno.json', 'utf8')).version")
          RUNTIME_VERSION=$(node -e '
            const source = require("node:fs").readFileSync("server.ts", "utf8");
            const match = source.match(/version:\s*"([^"]+)"/);
            if (!match) process.exit(1);
            process.stdout.write(match[1]);
          ')

          if [ "$VERSION" != "$RUNTIME_VERSION" ]; then
            echo "::error::deno.json ($VERSION) and server.ts ($RUNTIME_VERSION) versions differ"
            exit 1
          fi

          # Un viewer annonce sa version applicative a l'hote, pas celle du
          # paquet. DocViewer suivait la preversion et s'est retrouve deux
          # releases en arriere ; la convention des sept autres est une version
          # propre au viewer, qu'aucune release ne fait deriver.
          TRACKING=$(grep -rlE 'version: "[0-9][^"]*-' src/ui/*/src/*.tsx || true)
          if [ -n "$TRACKING" ]; then
            echo "::error::viewer declares a prerelease version: $TRACKING"
            echo "A viewer App version is its own, not the package release."
            exit 1
          fi

          # Sur une preversion les README portent la commande d'installation
          # epinglee. Deux betas ont ete publiees avec un README en retard : le
          # preflight local qui verifie ca n'est pas execute par ce workflow.
          if [[ "$VERSION" == *-* ]]; then
            for readme in README.md README.zh-TW.md; do
              STALE=$(grep -oE "@casys/mcp-erpnext@[0-9][A-Za-z0-9.-]*[A-Za-z0-9]" "$readme" \
                | grep -vFx "@casys/mcp-erpnext@$VERSION" | sort -u | tr '\n' ' ' || true)
              if [ -n "$STALE" ]; then
                echo "::error::$readme pins ${STALE}instead of $VERSION"
                exit 1
              fi
              if ! grep -qF "@casys/mcp-erpnext@$VERSION" "$readme"; then
                echo "::error::$readme documents no install command for $VERSION"
                exit 1
              fi
            done
          fi

          if [ "$GITHUB_REF" != "refs/tags/v$VERSION" ]; then
            echo "::error::Publish must run from refs/tags/v$VERSION, got $GITHUB_REF"
            exit 1
          fi

          if [[ "$VERSION" == *-* ]]; then
            EXPECTED_NPM_DIST_TAG=next
          else
            EXPECTED_NPM_DIST_TAG=latest
          fi

          NPM_DIST_TAG=${REQUESTED_NPM_DIST_TAG:-auto}
          if [ "$NPM_DIST_TAG" = auto ]; then
            NPM_DIST_TAG=$EXPECTED_NPM_DIST_TAG
          fi
          if [ "$NPM_DIST_TAG" != "$EXPECTED_NPM_DIST_TAG" ]; then
            echo "::error::$VERSION must publish with npm tag $EXPECTED_NPM_DIST_TAG, not $NPM_DIST_TAG"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_dist_tag=$NPM_DIST_TAG" >> "$GITHUB_OUTPUT"

  publish-jsr:
    needs: release_guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build UI viewers
        run: |
          cd src/ui
          npm ci
          node build-all.mjs

      - name: Guard against Finder duplicate artifacts in dist
        run: |
          if find src/ui/dist -type d -name '* 2' | grep -q .; then
            echo "::error::Finder duplicate artifacts found in src/ui/dist — refusing to publish"
            find src/ui/dist -type d -name '* 2'
            exit 1
          fi

      - name: Publish to JSR
        env:
          RELEASE_VERSION: ${{ needs.release_guard.outputs.version }}
        run: |
          if curl -fsSL --retry 3 https://jsr.io/@casys/mcp-erpnext/meta.json |
            RELEASE_VERSION="$RELEASE_VERSION" node -e '
              let body = "";
              process.stdin.on("data", chunk => body += chunk);
              process.stdin.on("end", () => {
                const meta = JSON.parse(body);
                process.exit(meta.versions?.[process.env.RELEASE_VERSION] ? 0 : 1);
              });
            '
          then
            echo "JSR version $RELEASE_VERSION already published, skipping"
          else
            npx jsr publish --allow-dirty
          fi

  publish-npm:
    needs: [release_guard, publish-jsr]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build UI viewers
        run: |
          cd src/ui
          npm ci
          node build-all.mjs

      - name: Guard against Finder duplicate artifacts in dist
        run: |
          if find src/ui/dist -type d -name '* 2' | grep -q .; then
            echo "::error::Finder duplicate artifacts found in src/ui/dist — refusing to publish"
            find src/ui/dist -type d -name '* 2'
            exit 1
          fi

      - name: Build Node.js bundle
        run: |
          bash scripts/build-node.sh

      - name: Publish to npm
        run: |
          cd dist-node/bin
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "@casys/mcp-erpnext@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "npm version $PACKAGE_VERSION already published; ensuring dist-tag $NPM_DIST_TAG"
            npm dist-tag add "@casys/mcp-erpnext@$PACKAGE_VERSION" "$NPM_DIST_TAG"
          else
            npm publish --access public --tag "$NPM_DIST_TAG"
          fi
        env:
          NPM_DIST_TAG: ${{ needs.release_guard.outputs.npm_dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
