name: Publish

on:
  workflow_call:
    inputs:
      npm_dist_tag:
        description: >-
          npm distribution tag. auto selects next for prereleases and latest
          for stable versions (never moving latest backwards); use maintenance
          to publish a stable backport below the current latest.
        required: false
        type: string
        default: auto
  workflow_dispatch:
    inputs:
      npm_dist_tag:
        description: npm distribution tag
        required: true
        type: choice
        default: auto
        options:
          - auto
          - next
          - latest
          - maintenance

jobs:
  release_guard:
    runs-on: ubuntu-latest
    outputs:
      npm_dist_tag: ${{ steps.release.outputs.npm_dist_tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - id: release
        name: Validate release ref, versions, and npm channel
        env:
          REQUESTED_NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
        # scripts/release-guard.mjs owns the policy (unit-tested with
        # `deno task test:scripts`): deno.json == server.ts, tag ref, dist-tag
        # channel, and latest never moves backwards. It prints one JSON
        # document (code + context + recovery on rejection).
        run: |
          node scripts/release-guard.mjs release \
            --ref "$GITHUB_REF" \
            --requested-tag "${REQUESTED_NPM_DIST_TAG:-auto}" \
            --github-output "$GITHUB_OUTPUT"

  publish-jsr:
    needs: release_guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build UI viewers
        run: |
          cd src/ui
          npm ci
          node build-all.mjs

      - name: Guard against Finder duplicate artifacts in dist
        run: |
          if find src/ui/dist -type d -name '* 2' | grep -q .; then
            echo "::error::Finder duplicate artifacts found in src/ui/dist — refusing to publish"
            find src/ui/dist -type d -name '* 2'
            exit 1
          fi

      - name: Publish to JSR
        env:
          RELEASE_VERSION: ${{ needs.release_guard.outputs.version }}
        run: |
          if curl -fsSL --retry 3 https://jsr.io/@casys/mcp-erpnext/meta.json |
            RELEASE_VERSION="$RELEASE_VERSION" node -e '
              let body = "";
              process.stdin.on("data", chunk => body += chunk);
              process.stdin.on("end", () => {
                const meta = JSON.parse(body);
                process.exit(meta.versions?.[process.env.RELEASE_VERSION] ? 0 : 1);
              });
            '
          then
            echo "JSR version $RELEASE_VERSION already published, skipping"
          else
            npx jsr publish --allow-dirty
          fi

  publish-npm:
    needs: [release_guard, publish-jsr]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build UI viewers
        run: |
          cd src/ui
          npm ci
          node build-all.mjs

      - name: Guard against Finder duplicate artifacts in dist
        run: |
          if find src/ui/dist -type d -name '* 2' | grep -q .; then
            echo "::error::Finder duplicate artifacts found in src/ui/dist — refusing to publish"
            find src/ui/dist -type d -name '* 2'
            exit 1
          fi

      - name: Build Node.js bundle
        run: |
          bash scripts/build-node.sh

      - name: Re-check npm dist-tag (latest must never move backwards)
        # The release_guard job ran minutes ago; re-verify against the live
        # registry right before the publish / idempotent dist-tag commands.
        run: node scripts/release-guard.mjs tag --version "$RELEASE_VERSION" --tag "$NPM_DIST_TAG"
        env:
          RELEASE_VERSION: ${{ needs.release_guard.outputs.version }}
          NPM_DIST_TAG: ${{ needs.release_guard.outputs.npm_dist_tag }}

      - name: Publish to npm
        run: |
          cd dist-node/bin
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "@casys/mcp-erpnext@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "npm version $PACKAGE_VERSION already published; ensuring dist-tag $NPM_DIST_TAG"
            npm dist-tag add "@casys/mcp-erpnext@$PACKAGE_VERSION" "$NPM_DIST_TAG"
          else
            npm publish --access public --tag "$NPM_DIST_TAG"
          fi
        env:
          NPM_DIST_TAG: ${{ needs.release_guard.outputs.npm_dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Align next with a newer stable release
        # A stable release supersedes the prereleases of its own line: `next`
        # must not keep pointing at an older beta. A prerelease of a later
        # line (for example 3.3.0-beta.1 while 3.2.1 ships) is left alone.
        if: needs.release_guard.outputs.npm_dist_tag == 'latest'
        run: |
          NEXT=$(npm view @casys/mcp-erpnext dist-tags.next 2>/dev/null || true)
          if [ -z "$NEXT" ] || node -e '
            const base = (v) => v.split("-")[0].split(".").map(Number);
            const [n, r] = [base(process.argv[1]), base(process.argv[2])];
            const cmp = n[0] - r[0] || n[1] - r[1] || n[2] - r[2];
            process.exit(cmp <= 0 ? 0 : 1);
          ' "$NEXT" "$RELEASE_VERSION"; then
            echo "Aligning next (${NEXT:-none}) with $RELEASE_VERSION"
            npm dist-tag add "@casys/mcp-erpnext@$RELEASE_VERSION" next
          else
            echo "Keeping next at $NEXT (newer line than $RELEASE_VERSION)"
          fi
        env:
          RELEASE_VERSION: ${{ needs.release_guard.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
