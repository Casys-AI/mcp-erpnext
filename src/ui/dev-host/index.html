<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Banc d’essai ERPNext · mcp-erpnext</title>
    <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      background: #101418;
      color: #c3ccd3;
      font: 12px/1.5 "JetBrains Mono", ui-monospace, monospace;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid #262c33;
    }
    header h1 {
      font: 600 14px/1 ui-sans-serif, system-ui;
      color: #e6ecf0;
      margin: 0 8px 0 0;
    }
    header select,
    header button {
      box-sizing: border-box;
      min-width: 0;
      max-width: 100%;
      background: #1a1e23;
      color: #e6ecf0;
      border: 1px solid #262c33;
      border-radius: 4px;
      padding: 5px 8px;
      font: inherit;
    }
    header .caps {
      color: #5d6a74;
      margin-left: auto;
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 960px);
      justify-content: center;
      gap: 14px;
      padding: 14px;
    }
    iframe {
      box-sizing: border-box;
      width: 100%;
      height: 640px;
      border: 1px solid #262c33;
      border-radius: 8px;
      background: #13161a;
    }
    #diagnostics {
      border: 1px solid #262c33;
      border-radius: 8px;
      background: #13161a;
      overflow: hidden;
    }
    #diagnostics summary {
      cursor: pointer;
      list-style: none;
      padding: 9px 12px;
      color: #8895a0;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    #log {
      border-top: 1px solid #262c33;
      padding: 10px 12px;
      height: 280px;
      overflow: auto;
    }
    #log h2 {
      font: 600 10px/1 inherit;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #8895a0;
      margin: 0 0 8px;
    }
    .ev {
      padding: 6px 0;
      border-bottom: 1px solid #1d2227;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .ev b {
      color: #3ec1cf;
    }
    .ev.msg b {
      color: #d95926;
    }
    .ev.ctx b {
      color: #c98500;
    }
    .ev small {
      color: #5d6a74;
    }
    @media (max-width: 720px) {
      #log {
        height: 240px;
      }
    }
    </style>
  </head>
  <body>
    <header>
      <h1>Banc d’essai ERPNext</h1>
      <select id="viewer">
        <option value="invoice">Facture</option>
        <option value="doclist" selected>Liste des sociétés</option>
        <option value="doc">Fiche d’une société</option>
        <option value="kanban">Tableau des tâches</option>
        <option value="stock">Stocks</option>
        <option value="funnel">Entonnoir commercial</option>
        <option value="kpi">Chiffre d’affaires</option>
        <option value="chart">Évolution des ventes</option>
      </select>
      <button id="reload">recharger</button>
      <span class="caps" id="status">—</span>
    </header>
    <main>
      <iframe id="frame" title="viewer"></iframe>
      <details id="diagnostics">
        <summary>Détails techniques</summary>
        <section id="log">
          <h2>journal hôte</h2>
        </section>
      </details>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
